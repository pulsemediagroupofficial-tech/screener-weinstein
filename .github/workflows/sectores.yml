name: Sectores (semanal)

# Domingo por la mañana, con el mercado ya cerrado.
# OJO: el cron de GitHub va en UTC. 07:00 UTC son las 09:00 en Madrid en
# horario de verano y las 08:00 en invierno.
on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:        # y a mano cuando quieras, desde la pestaña Actions

permissions:
  contents: write           # para poder guardar el informe en el repo

jobs:
  sectores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Calcular fuerza de sectores y enviar informe
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO:  ${{ secrets.EMAIL_TO }}
        run: python sectores.py --email

      - name: Guardar el informe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sectores-${{ github.run_number }}
          path: output/
          retention-days: 90

      - name: Publicar el histórico en el repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/*.csv
          git diff --staged --quiet || git commit -m "Sectores $(date +%Y-%m-%d)"
          git push
